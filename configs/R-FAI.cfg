version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
hostname R-FAI
boot-start-marker
boot-end-marker
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip cef
no ipv6 cef
multilink bundle-name authenticated
ip tcp synwait-time 5
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
interface GigabitEthernet0/0
 no ip address
 shutdown
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
interface GigabitEthernet1/0
 description Vers R-GENEVE
 ip address 203.0.113.2 255.255.255.252
 negotiation auto
interface GigabitEthernet2/0
 description Vers R-LAUSANNE
 ip address 198.51.100.2 255.255.255.252
 negotiation auto
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
interface FastEthernet4/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet4/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
ip forward-protocol nd
no ip http server
no ip http secure-server
control-plane
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
end
