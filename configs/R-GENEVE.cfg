version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
hostname R-GENEVE
boot-start-marker
boot-end-marker
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip cef
no ipv6 cef
multilink bundle-name authenticated
ip tcp synwait-time 5
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key <REDACTED_PSK> address 198.51.100.1
crypto ipsec transform-set TS-VPN esp-aes 256 esp-sha-hmac
 mode tunnel
crypto map VPN-MAP 10 ipsec-isakmp
 set peer 198.51.100.1
 set transform-set TS-VPN
 match address VPN-TRAFIC
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
interface GigabitEthernet0/0
 description LAN - Trunk vers SW-GNV
 no ip address
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
interface GigabitEthernet0/0.10
 description VLAN 10 - DIRECTION
 encapsulation dot1Q 10
 ip address 10.1.10.1 255.255.255.0
interface GigabitEthernet0/0.20
 description VLAN 20 - EMPLOYES
 encapsulation dot1Q 20
 ip address 10.1.20.1 255.255.255.0
interface GigabitEthernet0/0.30
 description VLAN 30 - SERVEURS
 encapsulation dot1Q 30
 ip address 10.1.30.1 255.255.255.0
interface GigabitEthernet1/0
 description WAN - Vers FAI
 ip address 203.0.113.1 255.255.255.252
 negotiation auto
 crypto map VPN-MAP
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
interface FastEthernet4/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet4/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
ip forward-protocol nd
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 203.0.113.2
ip access-list extended VPN-TRAFIC
 permit ip 10.1.0.0 0.0.255.255 10.2.0.0 0.0.255.255
control-plane
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
end
